  # 5. Productie Deploy (Bare Metal)
  production_deploy:
    name: 5. Productie Deploy (Bare Metal)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Production Files
        run: |
          rm -rf node_modules dist package-lock.json
          npm install
          npm run build
      - name: Deploy to App Directory
        run: |
          # Gebruik geen sudo voor mappen in de home directory om wachtwoordvragen te voorkomen
          mkdir -p /home/pindakaas/sportportal
          
          # Verwijder oude dist en kopieer nieuwe
          rm -rf /home/pindakaas/sportportal/dist
          cp -rf dist /home/pindakaas/sportportal/
          
          # Kopieer essentiële bestanden
          cp package.json server.js /home/pindakaas/sportportal/
          
          # Installeer dependencies in de doelmap
          cd /home/pindakaas/sportportal
          npm install --production --no-save
          
      - name: Restart Systemd Service
        run: |
          # Voor systemctl is sudo nodig. 
          # Zorg dat de runner-gebruiker NOPASSWD rechten heeft in /etc/sudoers voor dit commando.
          sudo systemctl daemon-reload
          sudo systemctl restart sportportal.service || (sudo journalctl -u sportportal.service -n 50 && exit 1)
